<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Countries Explorer</title>
</head>

<body>
    <h1>Countries Explorer</h1>

    <section id="view-section">
        <h2>View Countries</h2>
        <form id="view-form">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="e.g. India">

            <label for="capital">Capital:</label>
            <input type="text" id="capital" name="capital" placeholder="e.g. New Delhi">

            <label for="region">Region:</label>
            <input type="text" id="region" name="region" placeholder="e.g. Asia">

            <br>
            <h4>Advanced Search Criteria</h4>

            <label for="subregion">Subregion:</label>
            <input type="text" id="subregion" name="subregion" placeholder="e.g. Southern Asia">

            <label for="timezone">Timezone:</label>
            <input type="text" id="timezone" name="timezone" placeholder="e.g. IST">



            <button type="submit">Search</button>
        </form>

        <div id="results"></div>
    </section>

    <section id="add-section">
        <h2>Add/Update Country</h2>
        <form id="add-form">
            <label for="add-name">Name:</label>
            <input type="text" id="add-name" name="name" required>

            <label for="add-capital">Capital:</label>
            <input type="text" id="add-capital" name="capital" required>

            <label for="add-region">Region:</label>
            <input type="text" id="add-region" name="region" required>

            <button type="submit">Add Country</button>
        </form>

        <div id="add-message"></div>
    </section>

    <script src="index.js"></script>
</body>

</html>
